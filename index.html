<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="version-app" content="20261025120718">
  <title>Tablero de la Revelaci&oacute;n</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261025120718">
  <script>
    try { if (sessionStorage.getItem("revelacion-sesion") === "ok") document.documentElement.classList.add("autenticado"); } catch (_) {}
  </script>
</head>
<body>
  <div class="fondo-burbujas" aria-hidden="true">
    <div class="burbuja b1"></div>
    <div class="burbuja b2"></div>
    <div class="burbuja b3"></div>
    <div class="burbuja b4"></div>
    <div class="burbuja b5"></div>
    <div class="burbuja b6"></div>
  </div>

  <div id="pantalla-login" class="pantalla-login">
    <form id="form-login" class="login-card" autocomplete="off">
      <h1 class="login-titulo">&iquest;<span class="nene">Nene</span> o <span class="nena">Nena</span>?</h1>
      <p class="subtitulo">Ingres&aacute; para ver el tablero</p>

      <label class="login-campo">
        <span>Usuario</span>
        <input type="text" id="login-usuario" required autofocus>
      </label>
      <label class="login-campo">
        <span>Contrase&ntilde;a</span>
        <input type="password" id="login-clave" required>
      </label>

      <p id="login-error" class="login-error" aria-live="polite"></p>

      <button type="submit" class="btn btn-primario login-btn">Entrar</button>
    </form>
  </div>

  <button id="btn-hamburguesa" class="btn-hamburguesa" aria-label="Abrir menú">
    <span></span><span></span><span></span>
  </button>
  <div class="sidebar-overlay"></div>

  <div class="app-layout">
    <nav class="sidebar">
      <div class="sidebar-titulo">Revelación</div>
      <a href="#" class="nav-link activo" data-vista="tablero">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>Tablero</span>
      </a>
      <a href="#" class="nav-link" data-vista="participantes">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Participantes</span>
      </a>
      <a href="#" id="btn-cerrar-sesion" class="nav-link nav-salir">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Cerrar sesión</span>
      </a>
    </nav>

    <div class="app">
      <header class="encabezado">
        <h1>&iquest;<span class="nene">Nene</span> o <span class="nena">Nena</span>?</h1>
        <p class="subtitulo">Tablero de juegos de la revelaci&oacute;n</p>
      </header>

      <main class="contenido">
        <div id="vista-tablero">
          <div class="tabla-contenedor">
            <table id="tablero">
              <thead><tr id="fila-equipos"></tr></thead>
              <tbody id="cuerpo-juegos"></tbody>
              <tfoot><tr id="fila-totales"></tr></tfoot>
            </table>
          </div>
          <div class="acciones-tablero">
            <button id="btn-agregar-juego" class="btn btn-primario">+ Agregar juego</button>
          </div>
          <section class="podio" id="podio" aria-live="polite"></section>
        </div>

        <div id="vista-participantes" class="vista-oculta">
          <h2 class="titulo-seccion">Participantes por equipo</h2>
          <div id="grid-participantes" class="grid-participantes"></div>
        </div>
      </main>

      <footer class="pie">
        <button id="btn-reiniciar" class="btn btn-secundario">Reiniciar puntos</button>
      </footer>
    </div>
  </div>

  <script src="script.js?v=20261025120718"></script>
</body>
</html>
